<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="#050505" stroke="#1f2937" stroke-width="1"/>
  <circle cx="16" cy="16" r="10" stroke="url(#glowGrad)" stroke-width="1.5" stroke-dasharray="3 2" fill="none" opacity="0.6"/>
  <circle cx="16" cy="16" r="6" stroke="#00f2fe" stroke-width="1.2" fill="none" opacity="0.8"/>
  <circle cx="16" cy="16" r="3" fill="url(#glowGrad)" filter="url(#glow)"/>
</svg>
